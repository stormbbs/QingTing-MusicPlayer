plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

/**
 * 内置音源（酷我 / 网易云）解析直链要用的密钥。
 *
 * 不写死在代码里，是因为这个密钥是永久授权，一旦进仓库等于公开。
 * 改成从 local.properties 读——那个文件已被 .gitignore 忽略，
 * 你自己在本地填一次，构建出来的 APK 就自带密钥；别人 clone 下来是空的，
 * 得自己在 App 的「音源管理」里填。
 *
 *   # local.properties
 *   LINGLAN_KEY=CERU_KEY-xxxx
 */
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def linglanKey = localProps.getProperty('LINGLAN_KEY', '') ?: ''

android {
    namespace 'com.tom.musicplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tom.musicplayer'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.9-1021'

        buildConfigField 'String', 'LINGLAN_KEY', "\"${linglanKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'

    implementation 'io.coil-kt:coil-compose:2.7.0'

    // 网络播放：OkHttp 数据源（统一加 Basic 鉴权）+ ExoPlayer 边播边缓存
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
    implementation 'androidx.media3:media3-database:1.5.1'

    // 封面自动取色
    implementation 'androidx.palette:palette-ktx:1.0.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
