plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

/**
 * 内置音源（酷我 / 网易云）解析直链要用的密钥，**不再随构建注入**。
 *
 * 曾经的 LINGLAN_KEY 走 local.properties，虽然没进仓库，但打出来的 APK 里带着
 * 一把永久有效的密钥，等于谁装了这个包谁都能白嫖。现在改成纯手动：
 * 装好 App 后到「我的 → 在线音源 → 酷我/网易云 → 设置 → 音源密钥」填一次，
 * 存在设备本地（shared_prefs），只在那台手机上有效。
 */
android {
    namespace 'com.tom.musicplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tom.musicplayer'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '2.0-1021'

        // 保留这个字段只是为了不让老代码 import 报错，值恒为空。
        buildConfigField 'String', 'LINGLAN_KEY', '""'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'

    implementation 'io.coil-kt:coil-compose:2.7.0'

    // 网络播放：OkHttp 数据源（统一加 Basic 鉴权）+ ExoPlayer 边播边缓存
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
    implementation 'androidx.media3:media3-database:1.5.1'

    // 封面自动取色
    implementation 'androidx.palette:palette-ktx:1.0.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
